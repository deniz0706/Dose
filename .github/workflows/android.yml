name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Debug APK oluştur
        run: gradle :app:assembleDebug

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Dose-v0.1.0-debug.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Dose-v0.1.0
          path: Dose-v0.1.0-debug.apk
